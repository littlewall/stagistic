# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
$schema: 'https://moonrepo.dev/schemas/project.json'

# Inherits `lint` (vp lint) + `typecheck` (tsc -b). No plain `test` here (only
# browser tests), so exclude the inherited one.
workspace:
  inheritedTasks:
    exclude: ['test']

tasks:
  # predev -> db migrations compiled first (cross-project dep)
  dev:
    command: 'vp dev'
    deps: ['db:db-compile-migrations']
    preset: 'server'

  # prebuild -> db migrations compiled first
  build:
    command: 'vp build'
    deps: ['db:db-compile-migrations']
    options:
      cache: false

  preview:
    command: 'vp preview'
    preset: 'server'

  test-browser:
    command: 'vp test run -c vitest.browser.config.ts'
    options:
      cache: false

  # Multi-tab Playwright tests against the production build.
  test-e2e:
    command: 'vp test run -c vitest.e2e.config.ts'
    deps: ['~:build']
    options:
      cache: false

  # Cloud account flows (sign-in, passkeys, sync) through Caddy against the
  # local stack (docker-compose.dev.yml); skipped when it is not running.
  test-e2e-cloud:
    command: 'vp test run -c vitest.e2e-cloud.config.ts'
    options:
      cache: false
