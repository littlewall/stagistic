# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
$schema: 'https://moonrepo.dev/schemas/project.json'

# Inherits `lint` (vp lint) + `typecheck` (tsc -b). No tests here.
workspace:
  inheritedTasks:
    exclude: []

tasks:
  icons:
    command: 'node scripts/generate-icons.mjs'
    options:
      cache: false
  # Generates src-tauri/licenses/THIRD_PARTY_LICENSES.txt (bundled resource, gitignored).
  licenses:
    command: 'node scripts/licenses.mjs'
    options:
      cache: false
  build-test-host:
    command: 'cargo build --manifest-path src-tauri/Cargo.toml --example local_mcp_host --locked'
    options:
      cache: false
  test:
    command: 'vp test run --config vitest.config.ts'
    options:
      mergeArgs: 'replace'
      cache: false
  test-rust:
    deps: ['~:licenses']
    command: 'cargo test --manifest-path src-tauri/Cargo.toml --lib --bins --tests --locked'
    options:
      cache: false
  check-rust:
    deps: ['~:licenses']
    command: 'cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked'
    options:
      cache: false
  lint-rust:
    deps: ['~:licenses']
    script: 'cargo fmt --manifest-path src-tauri/Cargo.toml --check && cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings'
    options:
      cache: false
  format-rust:
    command: 'cargo fmt --manifest-path src-tauri/Cargo.toml'
    options:
      cache: false
  dev:
    command: 'tauri dev'
    deps: ['~:licenses', 'mcp:bundle-dev']
    preset: 'server'

  dev-ui:
    command: 'vp dev'
    preset: 'server'

  build:
    # Local unsigned build: updater artifacts need the private key (see desktop:release).
    command: 'tauri build --target aarch64-apple-darwin --config src-tauri/tauri.unsigned.conf.json'
    deps: ['~:licenses', 'mcp:bundle']
    options:
      cache: false

  release:
    command: 'tsx scripts/release/cli.ts'
    deps: ['~:licenses', 'mcp:contract-check']
    options:
      cache: false

  # Checks a DMG/app, a draft GitHub Release (--draft vX.Y.Z) or the live Release (--live X.Y.Z).
  release-verify:
    command: 'tsx scripts/release/verify.ts'
    options:
      cache: false

  # Interactive A -> B updater test on this Mac (docs/releasing/runbook.md).
  update-test:
    command: 'tsx scripts/release/updateTest.ts'
    options:
      cache: false
      interactive: true

  build-ui:
    command: 'vp build'
    options:
      cache: false

  build-release:
    command: 'tauri build --target aarch64-apple-darwin'
    deps: ['~:licenses', 'mcp:bundle-release']
    options:
      cache: false
