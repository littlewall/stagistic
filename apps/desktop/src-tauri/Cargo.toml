[package]
name = "stagistic-editor"
version = "1.0.1"
description = "Stagistic Editor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "3.0.0-alpha.6", features = [] }
# Tauri 3 no longer bundles a webview runtime: the app must depend on a runtime
# crate and select it via `Builder::runtime(...)` (see src/main.rs).
tauri-runtime-wry = "3.0.0-alpha.6"
tauri-plugin-dialog = "3.0.0-alpha.4"
tauri-plugin-fs = "3.0.0-alpha.3"
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-log = "3.0.0-alpha.3"
log = "0.4"
stagistic-mcp-protocol = { path = "../../../packages/mcp/crates/protocol" }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[features]
# Enabled automatically by `tauri build` to switch from the dev server to the
# bundled assets. DO NOT REMOVE and DO NOT add to `default` (that would break
# `tauri dev`).
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
