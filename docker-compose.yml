version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: stagistic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stagistic}
      POSTGRES_USER: ${POSTGRES_USER:-stagistic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stagistic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stagistic"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: stagistic-valkey
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: stagistic-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-stagistic}:${POSTGRES_PASSWORD:-stagistic}@postgres:5432/${POSTGRES_DB:-stagistic}
      REDIS_URL: redis://valkey:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy


  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: stagistic-web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
      VITE_HMR_HOST: ${VITE_HMR_HOST:-stagistic.local}
      VITE_HMR_PROTOCOL: ${VITE_HMR_PROTOCOL:-wss}
      VITE_HMR_PORT: ${VITE_HMR_PORT:-3000}
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-443}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json
      - ./apps/web/src/vite-env.d.ts:/app/apps/web/src/vite-env.d.ts
      - ./packages:/app/packages

volumes:
  postgres_data:
  valkey_data:
