# Local services for cloud sync (phases 3–6). Everything stays on this machine:
# Postgres, RustFS (S3), Mailpit (catches mail), the Deno server and Caddy
# (HTTPS for *.stagistic.local with mkcert certs). Setup: infra/README.md.
#
#   docker compose -f docker-compose.dev.yml up -d
#   moon run web:dev   # the editor, proxied as https://editor.stagistic.local
name: stagistic-dev

x-local-origins: &local-origins
  APP_ORIGINS: https://editor.stagistic.local${LOCAL_HTTPS_PORT_SUFFIX:-}
  AUTH_BASE_URL: https://auth.api.stagistic.local${LOCAL_HTTPS_PORT_SUFFIX:-}
  COOKIE_DOMAIN: stagistic.local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stagistic
      POSTGRES_USER: stagistic
      POSTGRES_PASSWORD: stagistic
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stagistic -d stagistic']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '${MAILPIT_PORT:-8025}:8025'

  # MinIO no longer publishes images; RustFS is S3-compatible (attachments, phase 6).
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: stagistic
      RUSTFS_SECRET_KEY: stagistic-secret
    command: ['/data']
    ports:
      - '${S3_PORT:-9000}:9000'
    volumes:
      - s3_data:/data

  server:
    image: denoland/deno:2.9.7
    working_dir: /repo
    command: ['run', '-A', '--sloppy-imports', '--watch', 'apps/server/src/main.ts']
    environment:
      <<: *local-origins
      SERVER_ROLES: ${SERVER_ROLES:-auth,collab}
      AUTH_PORT: '8787'
      COLLAB_PORT: '8788'
      DATABASE_URL: postgres://stagistic:stagistic@postgres:5432/stagistic
      # Local only; production secrets come from the deployment (phase 7).
      AUTH_SECRET: local-dev-secret-change-me-0123456789abcdef
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      JWT_AUDIENCE: https://sync.api.stagistic.local${LOCAL_HTTPS_PORT_SUFFIX:-}
      MAILPIT_URL: http://mailpit:8025
      AUTH_JWKS_URL: http://127.0.0.1:8787/api/auth/jwks
      MIGRATE_ON_START: '1'
    ports:
      - '${AUTH_PORT:-8787}:8787'
      - '${COLLAB_PORT:-8788}:8788'
    volumes:
      - ./:/repo
      - deno_cache:/deno-dir
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  caddy:
    image: caddy:2.10-alpine
    ports:
      # 80/443 may be taken by another local proxy: set CADDY_HTTPS_PORT=8443
      # and LOCAL_HTTPS_PORT_SUFFIX=:8443 (see infra/README.md).
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    volumes:
      - ./infra/proxy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/certs:/etc/caddy/certs:ro
      - caddy_data:/data
    extra_hosts:
      # The editor's Vite dev server runs on the host.
      - 'host.docker.internal:host-gateway'
    depends_on:
      - server

volumes:
  postgres_data:
  s3_data:
  deno_cache:
  caddy_data:
