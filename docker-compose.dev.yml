version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stagistic-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: stagistic
      POSTGRES_PASSWORD: stagistic_password
      POSTGRES_DB: stagistic
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stagistic"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: stagistic-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5173:5173"  # Vite HMR port
    labels:
      - traefik.enable=true
      - traefik.docker.network=webapp
      - 'traefik.http.routers.stagistic-dev-secure.rule=Host(`stagistic.local.dvdev.cz`)'
      - 'traefik.http.routers.stagistic-dev-secure.entrypoints=https'
      - 'traefik.http.routers.stagistic-dev-secure.tls=true'
      - 'traefik.http.services.stagistic-dev.loadbalancer.server.port=3000'
    networks:
      - default
      - webapp
    environment:
      NODE_ENV: development
      PORT: 3000
      
      # Database configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: stagistic
      POSTGRES_PASSWORD: stagistic_password
      POSTGRES_DB: stagistic
      
      # Server URLs (update these based on your Traefik setup)
      SERVER_BASE_URL: https://stagistic.local.dvdev.cz
      CLIENT_BASE_URL: https://stagistic.local.dvdev.cz
      
      # Email configuration (Postmark)
      POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
      POSTMARK_FROM_EMAIL: ${POSTMARK_FROM_EMAIL:-hello@yourdomain.com}
      
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount the entire app directory for hot reload
      - .:/app
      # Use named volumes for node_modules to avoid conflicts
      - node_modules:/app/node_modules
      - yarn_cache:/app/.yarn/cache
    stdin_open: true
    tty: true

volumes:
  postgres_dev_data:
    driver: local
  node_modules:
  yarn_cache:

networks:
  webapp:
    external: true
