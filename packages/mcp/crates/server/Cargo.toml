[package]
name = "stagistic-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
stagistic-mcp-protocol = { path = "../protocol" }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
