# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
$schema: 'https://moonrepo.dev/schemas/project.json'

# Inherits lint + typecheck + test. Adds the browser-test variant.
tasks:
  test-watch:
    command: 'vp test watch'
    preset: 'server'

  test-browser:
    command: 'vp test run -c vitest.browser.config.ts'
    options:
      cache: false
